apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: YOUR_DOCKERHUB_USERNAME/se-frontend:1.0
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: frontend-service}
spec:
  type: NodePort
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80, nodePort: 30081}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
      - name: backend
        image: YOUR_DOCKERHUB_USERNAME/se-backend:1.0
        ports: [{containerPort: 5000}]
